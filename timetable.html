<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<style>
  :root {
    --label-w: 76px;
    --colw: 96px;
    --head-h: 36px;
    --solo-h: 48px;   /* 着か発の一方だけの地点（自宅・バス停・学校） */
    --dep-h: 44px;
    --arr-h: 32px;
    --leg-h: 30px;

    --bg: #ffffff;
    --surface: #f8f9fa;
    --ink: #202124;
    --ink-2: #5f6368;
    --muted: #9aa0a6;
    --line: #e3e5e8;
    --line-strong: #c4c7cc;
    --accent: #1a73e8;
    --accent-bg: #e8f0fe;
    --accent-ink: #0b57d0;
    --sel-bg: #fef3c7;
    --sel-strong: #fde68a;
    --join: rgba(60, 64, 67, .09);
    --join-center: rgba(26, 115, 232, .16);
    --warn: #e37400;
    --warn-bg: #fff4e5;
    --late: #d93025;
    --late-bg: #fce8e6;
    --shadow: 0 2px 10px rgba(26, 115, 232, .22);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131314; --surface: #1e1f20; --ink: #e8eaed; --ink-2: #bdc1c6; --muted: #80868b;
      --line: #2d2f31; --line-strong: #44474a; --accent: #8ab4f8; --accent-bg: #1c2b41; --accent-ink: #a8c7fa;
      --sel-bg: #3a3320; --sel-strong: #5c4d1c; --join: rgba(255, 255, 255, .08); --join-center: rgba(138, 180, 248, .2);
      --warn: #fdab53; --warn-bg: #3b2a14; --late: #f28b82; --late-bg: #3c1f1d; --shadow: 0 2px 12px rgba(0, 0, 0, .5);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  button { font: inherit; color: inherit; }
  #app { width: 100%; max-width: 520px; margin: 0 auto; user-select: none; -webkit-user-select: none; }

  /* ---- 方向・目標 ---- */
  .bar { display: flex; align-items: center; gap: 6px; margin: 2px 2px 8px; }
  .seg { display: flex; gap: 3px; padding: 3px; background: var(--surface); border-radius: 12px; }
  .seg.goals { flex: 1; }
  .seg button { flex: 1; border: 0; background: none; padding: 6px 4px; border-radius: 9px; font-size: 14px;
    font-weight: 700; color: var(--ink-2); line-height: 1.1; white-space: nowrap; }
  .seg button small { display: block; font-size: 10px; font-weight: 500; color: var(--muted); }
  .seg button.active { background: var(--bg); color: var(--accent-ink); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  #stopBar.off { opacity: .45; }
  .bar .lbl { font-size: 12px; font-weight: 700; color: var(--ink-2); padding: 0 4px 0 6px; white-space: nowrap; }
  #stops button { font-size: 13px; padding: 5px 4px; }
  .bar .cap { font-size: 11px; color: var(--muted); writing-mode: vertical-rl; letter-spacing: 2px; }

  /* ---- 残り時間カード ---- */
  .count { display: flex; align-items: center; gap: 10px; margin: 0 2px 10px; padding: 10px 12px;
    border-radius: 14px; background: var(--accent-bg); min-height: 70px; }
  .count .what { flex: 1; min-width: 0; }
  .count .target { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .count .sub { font-size: 12px; color: var(--ink-2); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 6px; margin-left: 4px; }
  .chip.deadline { background: var(--warn-bg); color: var(--warn); }
  .chip.late { background: var(--late-bg); color: var(--late); }
  .count .remain { text-align: right; white-space: nowrap; color: var(--accent-ink); }
  .count .remain small { font-size: 12px; font-weight: 600; margin-right: 2px; }
  .count .remain b { font-size: 30px; font-variant-numeric: tabular-nums; letter-spacing: -.5px; }
  .count .remain span { font-size: 14px; font-weight: 700; margin-left: 1px; }
  .count.soon .remain { color: var(--warn); }
  .count.now .remain { color: var(--late); }
  .count.past .remain { color: var(--muted); }
  .count.past { background: var(--surface); }

  /* ---- 表本体 ---- */
  .grid { display: flex; border-top: 1px solid var(--line-strong); border-bottom: 1px solid var(--line-strong); }
  .labels { flex: 0 0 auto; width: var(--label-w); border-right: 1px solid var(--line-strong); background: var(--surface); }
  .scroller { flex: 0 0 auto; width: calc(var(--colw) * 3); overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x mandatory; overscroll-behavior-x: contain; scrollbar-width: none; }
  .scroller::-webkit-scrollbar { display: none; }
  /* 行×列のマス目。合流区間は横長の1マスにする */
  .track { display: grid; grid-auto-columns: var(--colw); width: max-content; position: relative; isolation: isolate; }

  .snap { scroll-snap-align: start; z-index: 0; }
  .snap.spacer { background: repeating-linear-gradient(45deg, transparent 0 7px, var(--line) 7px 8px); opacity: .6; }
  .hline { align-self: end; height: 1px; background: var(--line); z-index: 1; }
  .selband { background: var(--sel-bg); z-index: 1; }
  .card { margin: 3px; border-radius: 12px; background: var(--accent-bg); box-shadow: var(--shadow); z-index: 2; }
  .selpill { margin: 4px 7px; border-radius: 9px; background: var(--sel-strong); z-index: 3; }

  .head { height: var(--head-h); display: flex; align-items: center; justify-content: center; gap: 3px;
    font-size: 12px; color: var(--muted); z-index: 4; }
  .labels .head { box-shadow: inset 0 -1px 0 var(--line); font-size: 11px; }
  .head.c { color: var(--accent-ink); font-weight: 700; }
  .head.late { opacity: .55; }
  .tag { font-size: 10px; font-weight: 700; padding: 1px 4px; border-radius: 5px; white-space: nowrap; }
  .tag.deadline { background: var(--warn-bg); color: var(--warn); }
  .tag.other { background: var(--surface); color: var(--muted); }

  /* 地点ラベル（タップ可能） */
  .stop-label { display: flex; width: 100%; border: 0; padding: 0; margin: 0; background: none;
    text-align: left; cursor: pointer; box-shadow: inset 0 -1px 0 var(--line); }
  .stop-label:active { background: var(--line); }
  .stop-label .name { flex: 1; display: flex; align-items: center; padding-left: 8px;
    font-size: 14px; font-weight: 700; white-space: nowrap; }
  .stop-label .kinds { flex: 0 0 22px; display: flex; flex-direction: column; }
  .stop-label .kind { display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--muted); }
  .stop-label.selected { background: var(--sel-bg); box-shadow: inset 4px 0 0 #f9ab00, inset 0 -1px 0 var(--line); }
  .leg-label { height: var(--leg-h); box-shadow: inset 0 -1px 0 var(--line); }
  .h-solo { height: var(--solo-h); } .h-dep { height: var(--dep-h); } .h-arr { height: var(--arr-h); }

  /* 時刻・区間のマス */
  .cell, .mcell { position: relative; z-index: 4; display: flex; align-items: center;
    font-variant-numeric: tabular-nums; color: var(--ink-2); }
  .cell { justify-content: center; }
  .mcell { justify-content: flex-end; }
  .k-arr { font-size: 14px; color: var(--muted); }
  .k-dep { font-size: 19px; font-weight: 500; }
  .k-solo { font-size: 21px; font-weight: 500; }
  .k-leg { font-size: 13px; color: var(--muted); gap: 4px; }
  .empty { color: var(--line-strong) !important; font-size: 14px; font-weight: 400; }
  .c { color: var(--ink); }
  .c.k-dep, .c.k-solo { font-weight: 700; }
  .c.k-arr { color: var(--ink-2); font-weight: 600; }
  .is-late { color: var(--late) !important; }
  .is-deadline { color: var(--warn) !important; }
  .is-deadline .t::after, .cell.is-deadline::after { content: ""; position: absolute; left: 22%; right: 22%; bottom: 7px;
    height: 2px; border-radius: 1px; background: var(--warn); }
  .thru { font-size: 12px; color: var(--muted); font-weight: 500; }
  .plink { text-decoration: none; }
  .pill.link { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px currentColor; }
  .pill.link::after { content: "↗"; font-size: 9px; margin-left: 2px; }
  .mk { font-size: 10px; font-weight: 700; margin-left: 3px; padding: 1px 3px; border-radius: 4px; align-self: center; }
  .mk-京 { background: #fce8e6; color: #c5221f; }
  .mk-新 { background: #e6f4ea; color: #137333; }
  .pill { font-size: 11px; font-weight: 700; line-height: 1; padding: 3px 7px; border-radius: 999px; color: #fff; }

  /* 合流区間：帯は右向きの矢印形。時刻は帯の右端（画面からはみ出すときは画面の右端）に表示 */
  .mcell .band { position: absolute; top: 5px; bottom: 5px; left: 8px; right: 2px; background: var(--join);
    border-radius: 9px 0 0 9px; clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 50%, calc(100% - 12px) 100%, 0 100%); }
  .mcell.c .band { background: var(--join-center); }
  /* 分岐区間（復路）：時刻は帯の左端（本線のスジ）に。画面からはみ出すときは画面の左端 */
  .mcell.al { justify-content: flex-start; }
  .mcell.al .t { right: auto; left: 0; padding-right: 0; }
  .mcell .t { position: sticky; right: 0; flex: 0 0 var(--colw); width: var(--colw); height: 100%;
    display: flex; align-items: center; justify-content: center; gap: 4px; padding-right: 6px; }

  /* ---- 全体の位置（ミニマップ） ---- */
  .map { display: flex; gap: 1px; padding: 10px 2px 2px; }
  .tick { flex: 1; height: 22px; border: 0; padding: 0; background: none; display: flex; align-items: center; min-width: 0; }
  .tick i { display: block; width: 100%; height: 6px; border-radius: 2px; background: var(--line); }
  .tick.vis i { background: var(--line-strong); height: 9px; }
  .tick.cur i { background: var(--accent); height: 13px; }
  .tick.deadline i { box-shadow: 0 0 0 2px var(--warn); }
  .tick.goal i { box-shadow: 0 0 0 1.5px var(--muted); }
  .tick.late i { opacity: .4; }
  .map-cap { position: relative; height: 14px; font-size: 10px; color: var(--muted); margin: 0 2px; }
  .map-cap span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
  .map-cap span.sel { color: var(--warn); font-weight: 700; }

  /* ---- 下部 ---- */
  .footer { display: flex; align-items: center; gap: 6px; padding: 8px 2px 4px; font-size: 12px; color: var(--muted); }
  .nav { border: 1px solid var(--line-strong); background: var(--bg); border-radius: 20px; height: 38px; min-width: 52px; font-size: 15px; }
  .nav:active { background: var(--line); }
  .grow { flex: 1; }
  .testtime { display: flex; align-items: center; gap: 4px; }
  .testtime input { font-size: 13px; padding: 3px 4px; border: 1px solid var(--line-strong); border-radius: 6px; width: 96px;
    background: var(--bg); color: var(--ink); }
  .testtime button { font-size: 12px; border: 0; background: none; color: var(--accent-ink); padding: 4px; }

  .toast { position: fixed; left: 50%; top: 96px; transform: translateX(-50%); background: rgba(32,33,36,.94);
    color: #fff; font-size: 13px; padding: 8px 12px; border-radius: 8px; opacity: 0; transition: opacity .2s;
    pointer-events: none; white-space: nowrap; z-index: 10; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="app">
  <div class="bar">
    <div class="seg" id="dirs"></div>
    <div class="seg goals" id="goals"></div>
  </div>
  <div class="bar" id="stopBar" style="display:none">
    <span class="lbl">バス停</span>
    <div class="seg goals" id="stops"></div>
  </div>
  <div class="count" id="count">
    <div class="what"><div class="target" id="cTarget"></div><div class="sub" id="cSub"></div></div>
    <div class="remain" id="cRemain"></div>
  </div>
  <div class="grid">
    <div class="labels" id="labels"></div>
    <div class="scroller" id="scroller"><div class="track" id="track"></div></div>
  </div>
  <div class="map" id="map"></div>
  <div class="map-cap" id="mapCap"></div>
  <div class="footer">
    <button class="nav" id="prev" aria-label="前のスジ">◀</button>
    <button class="nav" id="next" aria-label="次のスジ">▶</button>
    <div class="grow"></div>
    <label class="testtime">テスト時刻
      <input type="time" id="testTime">
      <button id="clearTest">解除</button>
    </label>
  </div>
  <div class="toast" id="toast"></div>
</div>

<script>
const DATA = /*__DATA__*/null;
const KIND_LABEL = { arr: "着", dep: "発" };
const $ = (id) => document.getElementById(id);
const scroller = $("scroller"), track = $("track"), labelsEl = $("labels");

let dir = null, rows = [], trips = [], N = 0;
let lines = [];          // 表の各行（時刻または区間）: {key, gridRow, row, kind, cls}
let colW = 96, centerIdx = -1;
let goalIdx = 0;
let selStopName = null, selKey = null;
let schoolKey = null;
let status = [];         // 選択中の目標に対する各スジ: "ok" | "deadline" | "late" | null
let goalLast = [];       // 目標ごとの「間に合う最後のスジ」の番号
let runsByKey = {};      // 行ごとの合流区間 [{from, to}]

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

// ---------- 時刻 ----------
const toMin = (s) => { const [h, m] = s.split(":").map(Number); return h * 60 + m; };
function nowJstSeconds() {
  const t = $("testTime").value;
  if (t) return toMin(t) * 60;
  const p = new Intl.DateTimeFormat("ja-JP", { timeZone: "Asia/Tokyo", hour: "2-digit", minute: "2-digit",
    second: "2-digit", hourCycle: "h23" }).formatToParts(new Date());
  const g = (type) => Number(p.find((x) => x.type === type).value);
  return g("hour") * 3600 + g("minute") * 60 + g("second");
}

// ---------- 方向・目標 ----------
function buildBar() {
  const dirs = DATA.directions;
  $("dirs").style.display = dirs.length > 1 ? "" : "none";
  $("dirs").innerHTML = dirs.map((d, i) => `<button data-i="${i}">${d.name}</button>`).join("");
  $("dirs").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => switchDirection(Number(b.dataset.i))));
}

let stationKey = "", stopKey = "";
let trainMode = false;   // 復路で調布駅・笹塚をタップしたら、バスに関係なく列車を基準にしたスジを出す
function buildStops() {
  const has = !!dir.busStops;
  $("stopBar").style.display = has ? "" : "none";
  if (!has) { stopKey = ""; return; }
  const opts = [""].concat(dir.busStops);
  $("stops").innerHTML = opts.map((k) => `<button data-k="${k}">${k || "どちらでも"}</button>`).join("");
  $("stops").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => {
    stopKey = b.dataset.k;
    store.set(`stop:${dir.name}`, stopKey);
    if (trainMode) { trainMode = false; selStopName = null; }   // バス停を選ぶ＝学校から
    applyTrips();
  }));
  const saved = store.get(`stop:${dir.name}`);
  stopKey = opts.includes(saved) ? saved : "";
}

function buildStations() {
  $("goals").style.display = "";
  $("goals").innerHTML = dir.stations.map((st, i) => `<button data-k="${st.key}">${st.name}</button>`).join("");
  $("goals").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => {
    stationKey = b.dataset.k;
    store.set(`st:${dir.name}`, stationKey);
    applyTrips();
  }));
  const saved = store.get(`st:${dir.name}`);
  stationKey = dir.stations.some((st) => st.key === saved) ? saved : "";
}

// 復路：新宿の駅で絞り込む（どちらでも＝バスごとに新宿へ一番早く着く方）
function applyTrips() {
  if (dir.stations) {
    $("goals").querySelectorAll("button").forEach((b) => b.classList.toggle("active", b.dataset.k === stationKey));
    const v = (trainMode ? dir.trainViews : dir.views)[stationKey];
    rows = v.rows;
    // バス停で絞り込む（乗るバス停が選んだものだけ）。列車基準のときはバス停に関係なく全部
    $("stops").querySelectorAll("button").forEach((b) => b.classList.toggle("active", b.dataset.k === (trainMode ? "" : stopKey)));
    $("stopBar").classList.toggle("off", trainMode);
    trips = trainMode ? v.trips : v.trips.filter((t) => !stopKey || t.bus.startsWith(stopKey + "|"));
  } else {
    rows = dir.rows;
    trips = dir.trips;
  }
  N = trips.length;
  computeGoalLast();
  build();
  layout();
  renderGoal();
  const stops = rows.filter((r) => r.type === "stop");
  const stop = stops.find((s) => s.name === selStopName) || stops[0];
  selectStop(stop, false);
}

function buildGoals() {
  const goals = dir.goals.filter((g) => g.deadline);
  $("goals").style.display = goals.length ? "" : "none";
  $("goals").innerHTML = dir.goals.map((g, i) =>
    `<button data-i="${i}">${g.name}${g.deadline ? `<small>${g.deadline}まで</small>` : ""}</button>`).join("");
  $("goals").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => {
    goalIdx = Number(b.dataset.i);
    store.set(`goal:${dir.name}`, dir.goals[goalIdx].name);
    renderGoal();   // 印が変わるだけで、表示位置は動かさない
  }));
  const saved = dir.goals.findIndex((g) => g.name === store.get(`goal:${dir.name}`));
  goalIdx = saved >= 0 ? saved : 0;
}

function switchDirection(i) {
  dir = DATA.directions[i];
  $("dirs").querySelectorAll("button").forEach((b) => b.classList.toggle("active", Number(b.dataset.i) === i));
  const stops = dir.rows.filter((r) => r.type === "stop");
  const last = stops[stops.length - 1];   // 最後の地点（学校／新宿）は表示の切り替えで変わらない
  schoolKey = last.times.includes("arr") ? `${last.id}.arr` : null;
  if (dir.stations) buildStations(); else buildGoals();
  buildStops();
  trainMode = false;
  selStopName = null;   // 方向を切り替えたら最初の地点（自宅／学校）から
  applyTrips();
}

function computeGoalLast() {
  goalLast = dir.goals.map((g) => {
    if (!g.deadline || !schoolKey) return -1;
    let last = -1;
    trips.forEach((t, i) => { const a = t.times[schoolKey]; if (a && toMin(a) <= toMin(g.deadline)) last = i; });
    return last;
  });
}

function renderGoal() {
  const g = dir.goals[goalIdx];
  if (!dir.stations) $("goals").querySelectorAll("button").forEach((b) => b.classList.toggle("active", Number(b.dataset.i) === goalIdx));
  status = trips.map((t, i) => {
    if (!g || !g.deadline || !schoolKey || !t.times[schoolKey]) return null;
    if (i === goalLast[goalIdx]) return "deadline";
    return toMin(t.times[schoolKey]) <= toMin(g.deadline) ? "ok" : "late";
  });

  // 見出し：各目標の「最終」スジに印（選択中の目標は色付き）
  track.querySelectorAll(".head[data-i]").forEach((h) => {
    const i = Number(h.dataset.i);
    const tags = dir.goals.map((gg, gi) => goalLast[gi] === i
      ? `<span class="tag ${gi === goalIdx ? "deadline" : "other"}">${gg.name}最終</span>` : "").join("");
    h.innerHTML = `No.${i + 1}${tags}`;
    h.classList.toggle("late", status[i] === "late");
  });
  // 学校着の色
  track.querySelectorAll(`[data-key="${schoolKey}"]`).forEach((el) => {
    const from = Number(el.dataset.from), to = Number(el.dataset.to);
    const sts = status.slice(from, to + 1);
    el.classList.toggle("is-deadline", sts.includes("deadline"));
    el.classList.toggle("is-late", sts.length > 0 && sts.every((s) => s === "late"));
  });
  // ミニマップ
  $("map").querySelectorAll(".tick").forEach((b, i) => {
    b.classList.toggle("deadline", i === goalLast[goalIdx]);
    b.classList.toggle("goal", i !== goalLast[goalIdx] && goalLast.includes(i));
    b.classList.toggle("late", status[i] === "late");
  });
  $("mapCap").innerHTML = dir.goals.map((gg, gi) => goalLast[gi] < 0 ? "" :
    `<span class="${gi === goalIdx ? "sel" : ""}" style="left:${Math.min(95, Math.max(5, (goalLast[gi] + .5) / N * 100))}%">${gg.name}</span>`).join("");
  updateCountdown();
}

// ---------- 描画 ----------
function build() {
  // 左：地点ラベル
  labelsEl.innerHTML = `<div class="head">地点</div>`;
  lines = [];
  const heights = ["var(--head-h)"];
  rows.forEach((row, ri) => {
    if (row.type === "stop") {
      const b = document.createElement("button");
      b.className = "stop-label";
      b.dataset.name = row.name;
      b.innerHTML = `<span class="name">${row.name}</span><span class="kinds">${row.times.map((k) => {
        const h = row.times.length === 1 ? "solo" : k;
        lines.push({ key: `${row.id}.${k}`, row, kind: k, cls: `k-${h}`, last: k === row.times[row.times.length - 1] });
        heights.push(`var(--${h}-h)`);
        return `<span class="kind h-${h}">${KIND_LABEL[k]}</span>`;
      }).join("")}</span>`;
      b.addEventListener("click", () => selectStop(row, true));
      labelsEl.appendChild(b);
    } else {
      labelsEl.insertAdjacentHTML("beforeend", `<div class="leg-label"></div>`);
      lines.push({ key: row.id, row, kind: "leg", cls: "k-leg", last: true, next: rows[ri + 1] });
      heights.push("var(--leg-h)");
    }
  });
  lines.forEach((l, i) => (l.gridRow = i + 2));
  track.style.gridTemplateRows = heights.join(" ");

  const h = [];
  const all = `grid-row:1/${lines.length + 2}`;
  for (let c = 0; c < N + 2; c++) {
    const sp = c === 0 || c === N + 1;
    h.push(`<div class="snap${sp ? " spacer" : ""}" style="${all};grid-column:${c + 1}"></div>`);
  }
  h.push(`<div class="hline" style="grid-row:1;grid-column:1/${N + 3}"></div>`);
  lines.forEach((l) => { if (l.last) h.push(`<div class="hline" style="grid-row:${l.gridRow};grid-column:1/${N + 3}"></div>`); });
  h.push(`<div class="selband" id="selBand" style="grid-column:1/${N + 3};display:none"></div>`);
  h.push(`<div class="card" id="card" style="${all}"></div>`);
  h.push(`<div class="selpill" id="selPill" style="display:none"></div>`);
  trips.forEach((t, i) => h.push(`<div class="head" data-i="${i}" style="grid-row:1;grid-column:${i + 2}"></div>`));

  // 時刻・区間：隣と同じ便の区間は横長の1マスにまとめる
  runsByKey = {};
  for (const l of lines) {
    const runs = [];
    for (let i = 0; i < N; ) {
      const sig = trips[i].joins?.[l.key];
      let j = i;
      while (sig && j + 1 < N && trips[j + 1].joins?.[l.key] === sig) j++;
      runs.push({ from: i, to: j });
      const thru = l.kind !== "leg" && !trips[j].times[l.key] && l.row.id === "sz" && trips[j].times["s6.arr"];
      const mk = trips[j].marks?.[l.key];
      const inner = l.kind === "leg" ? legHtml(trips[j], l)
        : (thru ? `<span class="thru">${l.kind === "arr" ? "直通" : "↓"}</span>` : (trips[j].times[l.key] ?? (trips[j].train ? "" : "—"))) + (mk ? `<span class="mk mk-${mk}">${mk}</span>` : "");
      const empty = l.kind !== "leg" && !trips[j].times[l.key] && !thru;
      const pos = `grid-row:${l.gridRow};grid-column:${i + 2}/span ${j - i + 1}`;
      const data = `data-key="${l.key}" data-from="${i}" data-to="${j}"`;
      h.push(j > i
        ? `<div class="mcell ${l.cls}${anchorLeft() ? " al" : ""}" ${data} style="${pos}"><div class="band"></div><div class="t">${inner}</div></div>`
        : `<div class="cell ${l.cls}${empty ? " empty" : ""}" ${data} style="${pos}">${inner}</div>`);
      i = j + 1;
    }
    runsByKey[l.key] = runs;
  }
  track.innerHTML = h.join("");

  $("map").innerHTML = trips.map((t, i) =>
    `<button class="tick" data-i="${i}" aria-label="No.${t.no}"><i></i></button>`).join("");
  $("map").querySelectorAll(".tick").forEach((b) => b.addEventListener("click", () => scrollToIdx(Number(b.dataset.i))));
  centerIdx = -1;
}

function legHtml(trip, l) {
  const leg = trip.legs[l.key];
  if (!leg && trip.train && !trip.times[`${l.next.id}.${l.next.times[0]}`]) return "";   // 列車基準のスジは調布より前を空白に
  if (leg) {
    const pill = `<span class="pill${leg.url ? " link" : ""}" style="background:${leg.color}">${leg.label}</span>`;
    // 接近情報ページがあれば、バッジをタップすると別タブ（既定のブラウザ）で開く
    return `<span style="color:${leg.color}">↓</span>` +
      (leg.url ? `<a href="${leg.url}" target="_blank" rel="noopener" class="plink">${pill}</a>` : pill);
  }
  const nextKey = `${l.next.id}.${l.next.times[0]}`;
  return trip.times[nextKey] ? "↓" : `<span style="opacity:.4">—</span>`;
}

// 往路は左のスジが右へ合流していく（時刻は右端）。復路は1本のバスから右へ分かれていく（時刻は左端）
function anchorLeft() { return !!dir.views; }
function anchorOf(run) { return anchorLeft() ? run.from : run.to; }

function runOf(key, i) {
  return (runsByKey[key] || []).find((r) => r.from <= i && i <= r.to) || { from: i, to: i };
}

// ---------- レイアウト・スクロール ----------
function layout() {
  const total = $("app").clientWidth;
  colW = Math.floor((total - 76 - 1) / 3);
  document.documentElement.style.setProperty("--colw", colW + "px");
  document.documentElement.style.setProperty("--label-w", (total - colW * 3 - 1) + "px");
}

function scrollToIdx(i, smooth = true) {
  i = Math.max(0, Math.min(N - 1, i));
  scroller.scrollTo({ left: i * colW, behavior: smooth ? "smooth" : "auto" });
  setCenter(i);
}

function setCenter(i) {
  if (i === centerIdx) return;
  centerIdx = i;
  $("card").style.gridColumn = `${i + 2}`;
  track.querySelectorAll(".c").forEach((e) => e.classList.remove("c"));
  track.querySelectorAll(`.head[data-i="${i}"]`).forEach((e) => e.classList.add("c"));
  track.querySelectorAll("[data-from]").forEach((e) => {
    if (Number(e.dataset.from) <= i && i <= Number(e.dataset.to)) e.classList.add("c");
  });
  $("map").querySelectorAll(".tick").forEach((b, j) => {
    b.classList.toggle("cur", j === i);
    b.classList.toggle("vis", Math.abs(j - i) === 1);
  });
  placeSelPill();
  updateCountdown();
}

function placeSelPill() {
  const pill = $("selPill");
  const l = lines.find((x) => x.key === selKey);
  // 中央のスジの時刻が中央に表示されているときだけ強調（合流区間で時刻が右側にあるときは出さない）
  if (!l || centerIdx < 0 || anchorOf(runOf(selKey, centerIdx)) !== centerIdx || !trips[centerIdx].times[selKey]) {
    pill.style.display = "none"; return;
  }
  pill.style.display = "";
  pill.style.gridRow = `${l.gridRow}`;
  pill.style.gridColumn = `${centerIdx + 2}`;
}

let raf = 0;
scroller.addEventListener("scroll", () => {
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(() => setCenter(Math.max(0, Math.min(N - 1, Math.round(scroller.scrollLeft / colW)))));
}, { passive: true });

window.addEventListener("resize", () => { const k = centerIdx; layout(); centerIdx = -1; scrollToIdx(k, false); });
$("prev").addEventListener("click", () => scrollToIdx(centerIdx - 1));
$("next").addEventListener("click", () => scrollToIdx(centerIdx + 1));
$("clearTest").addEventListener("click", () => { $("testTime").value = ""; updateCountdown(); });
$("testTime").addEventListener("change", updateCountdown);

// ---------- 地点タップ ----------
function selectStop(row, smooth) {
  if (dir.trainViews) {   // 復路：調布駅から先なら列車基準、学校・バス停ならバス基準
    const wantTrain = !["s0", "s2"].includes(row.id);
    if (wantTrain !== trainMode) {
      trainMode = wantTrain;
      selStopName = row.name;
      applyTrips();   // 表を作り直して、この地点で選び直す
      return;
    }
  }
  const kind = row.times.includes("dep") ? "dep" : "arr";
  const key = `${row.id}.${kind}`;
  const nowMin = Math.floor(nowJstSeconds() / 60);

  let idx = trips.findIndex((t) => t.times[key] && toMin(t.times[key]) >= nowMin);
  if (idx === -1) {
    for (let i = N - 1; i >= 0; i--) if (trips[i].times[key]) { idx = i; break; }
    toast("これ以降のスジはありません（最終を表示）");
  }
  // 合流区間の中なら、まとまりの最後のスジ（時刻が表示される列）を中央にする
  if (idx >= 0) {
    const run = runOf(key, idx);
    idx = anchorOf(run);   // 時刻が表示される列
    // 同じ便のまとまりの中に「優先」のスジ（復路の笹塚乗換＝先着）があれば、それを中央に
    for (let k = run.from; k <= run.to; k++) if (trips[k].prefer) { idx = k; break; }
  }

  selStopName = row.name;
  selKey = key;
  labelsEl.querySelectorAll(".stop-label").forEach((b) => b.classList.toggle("selected", b.dataset.name === row.name));
  const l = lines.find((x) => x.key === key);
  $("selBand").style.display = "";
  $("selBand").style.gridRow = `${l.gridRow}`;
  if (idx >= 0) { centerIdx = -1; scrollToIdx(idx, smooth); }
}

// ---------- 残り時間（表示位置は動かさず、数字だけ更新する） ----------
function updateCountdown() {
  if (!dir || centerIdx < 0 || !selKey) return;
  const trip = trips[centerIdx];
  const row = rows.find((r) => r.type === "stop" && selKey.startsWith(r.id + "."));
  const kind = selKey.split(".")[1];
  const v = trip.times[selKey];
  const card = $("count");
  card.className = "count";

  const g = dir.goals[goalIdx];
  const st = status[centerIdx];
  const arr = schoolKey ? trip.times[schoolKey] : null;
  const last = rows[rows.length - 1];
  let sub = `No.${centerIdx + 1}${trainMode ? "（調布からの列車）" : ""}`;
  if (arr) sub += ` ・ ${last.name} ${arr}着`;
  if (g?.deadline) sub += `（${g.name} ${g.deadline}まで）`;
  if (st === "deadline") sub += `<span class="chip deadline">間に合う最終</span>`;
  if (st === "late") sub += `<span class="chip late">遅刻</span>`;
  $("cSub").innerHTML = sub;

  if (!v) {
    $("cTarget").textContent = `このスジは${row.name}を通りません`;
    $("cRemain").innerHTML = "";
    card.classList.add("past");
    return;
  }
  $("cTarget").textContent = `📍 ${row.name} ${v}${KIND_LABEL[kind]}まで`;
  const diffSec = toMin(v) * 60 - nowJstSeconds();
  const m = Math.floor(diffSec / 60);
  if (diffSec < 0) {
    const ago = Math.ceil(-diffSec / 60);
    const agoTxt = ago >= 60 ? `${Math.floor(ago / 60)}時間${ago % 60 ? `${ago % 60}分` : ""}前` : `${ago}分前`;
    $("cRemain").innerHTML = `<span>${kind === "dep" ? "発車済み" : "到着済み"}</span><br><small>${agoTxt}</small>`;
    card.classList.add("past");
  } else if (m === 0) {
    $("cRemain").innerHTML = `<b>まもなく</b>`;
    card.classList.add("now");
  } else {
    const txt = m >= 60 ? `<b>${Math.floor(m / 60)}</b><span>時間</span><b>${m % 60}</b><span>分</span>`
                        : `<b>${m}</b><span>分</span>`;
    $("cRemain").innerHTML = `<small>あと</small>${txt}`;
    if (m <= 2) card.classList.add("now"); else if (m <= 5) card.classList.add("soon");
  }
}
setInterval(updateCountdown, 10000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) updateCountdown(); });

let toastTimer = 0;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

// ---------- 起動 ----------
buildBar();
// 起動時は時刻で方向を決める（正午まで往路、それ以降は復路）
const startDir = Math.floor(nowJstSeconds() / 3600) < 12 ? 0 : DATA.directions.length - 1;
switchDirection(startDir);
</script>
