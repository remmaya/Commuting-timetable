<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<style>
  :root {
    --label-w: 76px;
    --colw: 96px;
    --head-h: 36px;
    --solo-h: 48px;   /* 着か発の一方だけの地点（自宅・バス停・学校） */
    --dep-h: 44px;
    --arr-h: 32px;
    --leg-h: 30px;

    --bg: #ffffff;
    --surface: #f8f9fa;
    --ink: #202124;
    --ink-2: #5f6368;
    --muted: #9aa0a6;
    --line: #e3e5e8;
    --line-strong: #c4c7cc;
    --accent: #1a73e8;
    --accent-bg: #e8f0fe;
    --accent-ink: #0b57d0;
    --sel-bg: #fef3c7;
    --sel-strong: #fde68a;
    --join: rgba(60, 64, 67, .08);
    --join-center: rgba(26, 115, 232, .14);
    --warn: #e37400;
    --warn-bg: #fff4e5;
    --late: #d93025;
    --late-bg: #fce8e6;
    --shadow: 0 2px 10px rgba(26, 115, 232, .22);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131314;
      --surface: #1e1f20;
      --ink: #e8eaed;
      --ink-2: #bdc1c6;
      --muted: #80868b;
      --line: #2d2f31;
      --line-strong: #44474a;
      --accent: #8ab4f8;
      --accent-bg: #1c2b41;
      --accent-ink: #a8c7fa;
      --sel-bg: #3a3320;
      --sel-strong: #5c4d1c;
      --join: rgba(255, 255, 255, .07);
      --join-center: rgba(138, 180, 248, .18);
      --warn: #fdab53;
      --warn-bg: #3b2a14;
      --late: #f28b82;
      --late-bg: #3c1f1d;
      --shadow: 0 2px 12px rgba(0, 0, 0, .5);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  button { font: inherit; color: inherit; }
  #app { width: 100%; max-width: 520px; margin: 0 auto; user-select: none; -webkit-user-select: none; }

  /* ---- 時刻表タブ ---- */
  .tabs { display: flex; gap: 4px; padding: 4px; background: var(--surface); border-radius: 12px; margin: 2px 2px 8px; }
  .tab { flex: 1; border: 0; background: none; padding: 8px 0; border-radius: 9px; font-size: 14px;
    font-weight: 600; color: var(--ink-2); }
  .tab.active { background: var(--bg); color: var(--accent-ink); box-shadow: 0 1px 3px rgba(0,0,0,.15); }

  /* ---- 残り時間カード ---- */
  .count { display: flex; align-items: center; gap: 10px; margin: 0 2px 10px; padding: 10px 12px;
    border-radius: 14px; background: var(--accent-bg); min-height: 70px; }
  .count .what { flex: 1; min-width: 0; }
  .count .target { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .count .sub { font-size: 12px; color: var(--ink-2); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .count .sub .chip { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 6px; margin-left: 4px; }
  .chip.deadline { background: var(--warn-bg); color: var(--warn); }
  .chip.late { background: var(--late-bg); color: var(--late); }
  .count .remain { text-align: right; white-space: nowrap; color: var(--accent-ink); }
  .count .remain small { font-size: 12px; font-weight: 600; margin-right: 2px; }
  .count .remain b { font-size: 30px; font-variant-numeric: tabular-nums; letter-spacing: -.5px; }
  .count .remain span { font-size: 14px; font-weight: 700; margin-left: 1px; }
  .count.soon .remain { color: var(--warn); }
  .count.now .remain { color: var(--late); }
  .count.past .remain { color: var(--muted); }
  .count.past { background: var(--surface); }

  /* ---- 表本体 ---- */
  .grid { display: flex; border-top: 1px solid var(--line-strong); border-bottom: 1px solid var(--line-strong); }
  .labels { flex: 0 0 auto; width: var(--label-w); border-right: 1px solid var(--line-strong); background: var(--surface); }
  .scroller { flex: 0 0 auto; width: calc(var(--colw) * 3); overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x mandatory; overscroll-behavior-x: contain; scrollbar-width: none; }
  .scroller::-webkit-scrollbar { display: none; }
  .track { display: flex; width: max-content; }
  .col { flex: 0 0 var(--colw); width: var(--colw); scroll-snap-align: start; position: relative; isolation: isolate; }
  .col.spacer { background: repeating-linear-gradient(45deg, transparent 0 7px, var(--line) 7px 8px); opacity: .6; }

  /* 中央（基準）スジ：浮いたカード */
  .col.center::before { content: ""; position: absolute; inset: 3px 3px 3px; border-radius: 12px;
    background: var(--accent-bg); box-shadow: var(--shadow); z-index: -1; }

  .head { height: var(--head-h); display: flex; align-items: center; justify-content: center; gap: 4px;
    font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); }
  .labels .head { font-size: 11px; }
  .col.center .head { color: var(--accent-ink); font-weight: 700; border-bottom-color: transparent; }
  .head .tag { font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 5px; }
  .head .tag.deadline { background: var(--warn-bg); color: var(--warn); }
  .head .tag.late { background: var(--late-bg); color: var(--late); }

  /* 地点ラベル（タップ可能） */
  .stop-label { display: flex; width: 100%; border: 0; padding: 0; margin: 0; background: none;
    text-align: left; cursor: pointer;
    box-shadow: inset 0 -1px 0 var(--line); }  /* 線を高さに含めない（右側のセルと揃える） */
  .stop-label:active { background: var(--line); }
  .stop-label .name { flex: 1; display: flex; align-items: center; padding-left: 8px;
    font-size: 14px; font-weight: 700; white-space: nowrap; }
  .stop-label .kinds { flex: 0 0 22px; display: flex; flex-direction: column; }
  .stop-label .kind { display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--muted); }
  .stop-label.selected { background: var(--sel-bg); box-shadow: inset 4px 0 0 #f9ab00, inset 0 -1px 0 var(--line); }

  .h-solo { height: var(--solo-h); } .h-dep { height: var(--dep-h); } .h-arr { height: var(--arr-h); }
  .leg-label, .leg { height: var(--leg-h); }

  /* 時刻セル */
  .cell { display: flex; align-items: center; justify-content: center; position: relative; isolation: isolate;
    font-variant-numeric: tabular-nums; color: var(--ink-2); }
  .cell.last { border-bottom: 1px solid var(--line); }
  .cell.k-arr { font-size: 14px; color: var(--muted); }
  .cell.k-dep { font-size: 19px; font-weight: 500; }
  .cell.h-solo { font-size: 21px; font-weight: 500; }
  .cell.empty { color: var(--line-strong); font-size: 14px; font-weight: 400; }
  .col.center .cell { color: var(--ink); }
  .col.center .cell.k-dep, .col.center .cell.h-solo { font-weight: 700; }
  .col.center .cell.k-arr { color: var(--ink-2); font-weight: 600; }
  .cell.sel { background: var(--sel-bg); }
  .col.center .cell.sel::after { content: ""; position: absolute; inset: 4px 7px; border-radius: 9px;
    background: var(--sel-strong); z-index: -1; }
  .cell.is-late { color: var(--late) !important; }
  .cell.is-deadline { color: var(--warn) !important; }
  .cell.is-deadline::before { content: ""; position: absolute; left: 22%; right: 22%; bottom: 7px; height: 2px;
    border-radius: 1px; background: var(--warn); }

  .leg { position: relative; isolation: isolate; display: flex; align-items: center; justify-content: center;
    gap: 4px; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--line); }
  .leg .pill { font-size: 11px; font-weight: 700; line-height: 1; padding: 3px 7px; border-radius: 999px; color: #fff; }
  .leg-label { border-bottom: 1px solid var(--line); }

  /* 合流：隣のスジと同じ便 → 帯でつなぐ（中央カードより手前、文字より奥） */
  .join-r::before, .join-l::before { content: ""; position: absolute; top: 5px; bottom: 5px; background: var(--join); z-index: -1; }
  .join-r::before { left: 8px; right: 0; border-radius: 9px 0 0 9px; }
  .join-l::before { left: 0; right: 8px; border-radius: 0 9px 9px 0; }
  .join-l.join-r::before { left: 0; right: 0; border-radius: 0; }
  .col.center .join-l::before, .col.center .join-r::before { background: var(--join-center); }

  /* ---- 全体の位置（ミニマップ） ---- */
  .map { display: flex; gap: 2px; padding: 10px 2px 4px; }
  .tick { flex: 1; height: 22px; border: 0; padding: 0; background: none; display: flex; align-items: center; }
  .tick i { display: block; width: 100%; height: 6px; border-radius: 3px; background: var(--line); }
  .tick.vis i { background: var(--line-strong); height: 8px; }
  .tick.cur i { background: var(--accent); height: 12px; }
  .tick.deadline i { box-shadow: 0 0 0 2px var(--warn); }
  .tick.late i { opacity: .45; }
  .map-cap { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); padding: 0 2px; }

  /* ---- 下部 ---- */
  .footer { display: flex; align-items: center; gap: 6px; padding: 8px 2px 4px; font-size: 12px; color: var(--muted); }
  .nav { border: 1px solid var(--line-strong); background: var(--bg); border-radius: 20px; height: 38px; min-width: 52px; font-size: 15px; }
  .nav:active { background: var(--line); }
  .grow { flex: 1; }
  .testtime { display: flex; align-items: center; gap: 4px; }
  .testtime input { font-size: 13px; padding: 3px 4px; border: 1px solid var(--line-strong); border-radius: 6px; width: 96px;
    background: var(--bg); color: var(--ink); }
  .testtime button { font-size: 12px; border: 0; background: none; color: var(--accent-ink); padding: 4px; }

  .toast { position: fixed; left: 50%; top: 96px; transform: translateX(-50%); background: rgba(32,33,36,.94);
    color: #fff; font-size: 13px; padding: 8px 12px; border-radius: 8px; opacity: 0; transition: opacity .2s;
    pointer-events: none; white-space: nowrap; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="app">
  <div class="tabs" id="tabs"></div>
  <div class="count" id="count">
    <div class="what"><div class="target" id="cTarget"></div><div class="sub" id="cSub"></div></div>
    <div class="remain" id="cRemain"></div>
  </div>
  <div class="grid">
    <div class="labels" id="labels"></div>
    <div class="scroller" id="scroller"><div class="track" id="track"></div></div>
  </div>
  <div class="map" id="map"></div>
  <div class="map-cap"><span id="capL"></span><span id="capR"></span></div>
  <div class="footer">
    <button class="nav" id="prev" aria-label="前のスジ">◀</button>
    <button class="nav" id="next" aria-label="次のスジ">▶</button>
    <div class="grow"></div>
    <label class="testtime">テスト時刻
      <input type="time" id="testTime">
      <button id="clearTest">解除</button>
    </label>
  </div>
  <div class="toast" id="toast"></div>
</div>

<script>
const DATA = /*__DATA__*/null;
const KIND_LABEL = { arr: "着", dep: "発" };
const $ = (id) => document.getElementById(id);
const scroller = $("scroller"), track = $("track"), labelsEl = $("labels");

let tt = null;            // 表示中の時刻表
let trips = [], N = 0;
let colW = 96, centerIdx = 0;
let selStopName = null;   // タップした地点（時刻表を切り替えても引き継ぐ）
let selKey = null;        // その地点で見る時刻のキー（例 s2.dep）
let schoolKey = null;     // 最後の地点（学校）の着
let status = [];          // 各スジ: "ok" | "deadline" | "late" | null

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

// ---------- 時刻 ----------
const toMin = (s) => { const [h, m] = s.split(":").map(Number); return h * 60 + m; };
const fmt = (m) => `${Math.floor(m / 60)}:${String(m % 60).padStart(2, "0")}`;

function nowJstSeconds() {
  const t = $("testTime").value;            // テスト時刻（固定）
  if (t) return toMin(t) * 60;
  const p = new Intl.DateTimeFormat("ja-JP", { timeZone: "Asia/Tokyo", hour: "2-digit", minute: "2-digit",
    second: "2-digit", hourCycle: "h23" }).formatToParts(new Date());
  const g = (type) => Number(p.find((x) => x.type === type).value);
  return g("hour") * 3600 + g("minute") * 60 + g("second");
}

// ---------- 時刻表の切り替え ----------
function buildTabs() {
  $("tabs").innerHTML = DATA.timetables.map((t, i) =>
    `<button class="tab" data-i="${i}">${t.name}</button>`).join("");
  $("tabs").querySelectorAll(".tab").forEach((b) =>
    b.addEventListener("click", () => switchTimetable(Number(b.dataset.i), true)));
}

function switchTimetable(i, smooth) {
  tt = DATA.timetables[i];
  trips = tt.trips; N = trips.length;
  store.set("tt", tt.name);
  $("tabs").querySelectorAll(".tab").forEach((b) => b.classList.toggle("active", Number(b.dataset.i) === i));

  const stops = tt.rows.filter((r) => r.type === "stop");
  const last = stops[stops.length - 1];
  schoolKey = last.times.includes("arr") ? `${last.id}.arr` : null;
  computeStatus();
  build();
  layout();
  // 切り替えも「操作」なので、その時点の時刻で選択中の地点から位置決めする
  const stop = stops.find((s) => s.name === selStopName) || stops[0];
  selectStop(stop, false);
}

function computeStatus() {
  status = trips.map(() => null);
  if (!tt.deadline || !schoolKey) return;
  const dl = toMin(tt.deadline);
  let lastOk = -1;
  trips.forEach((t, i) => {
    const a = t.times[schoolKey];
    if (!a) return;
    if (toMin(a) <= dl) { status[i] = "ok"; lastOk = i; } else status[i] = "late";
  });
  if (lastOk >= 0) status[lastOk] = "deadline";   // 締切に間に合う最後のスジ
}

// ---------- 描画 ----------
function hClass(row, k) {
  return row.times.length === 1 ? "h-solo" : `h-${k}`;
}

function build() {
  labelsEl.innerHTML = `<div class="head">地点</div>`;
  for (const row of tt.rows) {
    if (row.type === "stop") {
      const b = document.createElement("button");
      b.className = "stop-label";
      b.dataset.name = row.name;
      b.innerHTML = `<span class="name">${row.name}</span><span class="kinds">${
        row.times.map((k) => `<span class="kind ${hClass(row, k)}">${KIND_LABEL[k]}</span>`).join("")}</span>`;
      b.addEventListener("click", () => selectStop(row, true));
      labelsEl.appendChild(b);
    } else {
      labelsEl.insertAdjacentHTML("beforeend", `<div class="leg-label"></div>`);
    }
  }

  const cols = [`<div class="col spacer"><div class="head"></div></div>`];
  trips.forEach((trip, i) => {
    const st = status[i];
    const tag = st === "deadline" ? `<span class="tag deadline">最終</span>`
              : st === "late" ? `<span class="tag late">遅刻</span>` : "";
    let html = `<div class="col" data-idx="${i}"><div class="head">No.${trip.no}${tag}</div>`;
    tt.rows.forEach((row, ri) => {
      if (row.type === "stop") {
        row.times.forEach((k, j) => {
          const key = `${row.id}.${k}`;
          const v = trip.times[key];
          const cls = ["cell", `k-${k}`, hClass(row, k), j === row.times.length - 1 ? "last" : "",
            v ? "" : "empty", joinClass(i, key),
            key === schoolKey && st === "late" ? "is-late" : "",
            key === schoolKey && st === "deadline" ? "is-deadline" : ""].join(" ");
          html += `<div class="${cls}" data-key="${key}">${v ?? "—"}</div>`;
        });
      } else {
        html += `<div class="leg ${joinClass(i, row.id)}">${legHtml(trip, row, tt.rows[ri + 1])}</div>`;
      }
    });
    cols.push(html + `</div>`);
  });
  cols.push(`<div class="col spacer"><div class="head"></div></div>`);
  track.innerHTML = cols.join("");

  $("map").innerHTML = trips.map((t, i) =>
    `<button class="tick ${status[i] || ""}" data-i="${i}" aria-label="No.${t.no}"><i></i></button>`).join("");
  $("map").querySelectorAll(".tick").forEach((b) =>
    b.addEventListener("click", () => scrollToIdx(Number(b.dataset.i))));
  const homeKey = (() => { const s = tt.rows[0]; return `${s.id}.${s.times[s.times.length - 1]}`; })();
  $("capL").textContent = `${tt.rows[0].name} ${trips[0].times[homeKey] ?? ""}`;
  $("capR").textContent = `${trips[N - 1].times[homeKey] ?? ""}`;
  centerIdx = -1;
}

function legHtml(trip, row, next) {
  const leg = trip.legs[row.id];
  if (leg) return `<span style="color:${leg.color}">↓</span><span class="pill" style="background:${leg.color}">${leg.label}</span>`;
  const nextKey = `${next.id}.${next.times[0]}`;
  return trip.times[nextKey] ? "↓" : `<span style="opacity:.4">—</span>`;
}

function joinClass(i, key) {
  const id = trips[i].joins?.[key];
  if (!id) return "";
  const c = [];
  if (i > 0 && trips[i - 1].joins?.[key] === id) c.push("join-l");
  if (i < N - 1 && trips[i + 1].joins?.[key] === id) c.push("join-r");
  return c.join(" ");
}

// ---------- レイアウト・スクロール ----------
function layout() {
  const total = $("app").clientWidth;
  colW = Math.floor((total - 76 - 1) / 3);
  document.documentElement.style.setProperty("--colw", colW + "px");
  document.documentElement.style.setProperty("--label-w", (total - colW * 3 - 1) + "px");
}

function scrollToIdx(i, smooth = true) {
  i = Math.max(0, Math.min(N - 1, i));
  scroller.scrollTo({ left: i * colW, behavior: smooth ? "smooth" : "auto" });
  setCenter(i);
}

function setCenter(i) {
  if (i === centerIdx) return;
  centerIdx = i;
  track.querySelectorAll(".col.center").forEach((c) => c.classList.remove("center"));
  track.querySelector(`.col[data-idx="${i}"]`)?.classList.add("center");
  $("map").querySelectorAll(".tick").forEach((b, j) => {
    b.classList.toggle("cur", j === i);
    b.classList.toggle("vis", Math.abs(j - i) === 1);
  });
  updateCountdown();
}

let raf = 0;
scroller.addEventListener("scroll", () => {
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(() =>
    setCenter(Math.max(0, Math.min(N - 1, Math.round(scroller.scrollLeft / colW)))));
}, { passive: true });

window.addEventListener("resize", () => { const k = centerIdx; layout(); centerIdx = -1; scrollToIdx(k, false); });
$("prev").addEventListener("click", () => scrollToIdx(centerIdx - 1));
$("next").addEventListener("click", () => scrollToIdx(centerIdx + 1));
$("clearTest").addEventListener("click", () => { $("testTime").value = ""; updateCountdown(); });
$("testTime").addEventListener("change", updateCountdown);

// ---------- 地点タップ ----------
function selectStop(row, smooth) {
  const kind = row.times.includes("dep") ? "dep" : "arr";
  const key = `${row.id}.${kind}`;
  const nowMin = Math.floor(nowJstSeconds() / 60);

  let idx = trips.findIndex((t) => t.times[key] && toMin(t.times[key]) >= nowMin);
  if (idx === -1) {
    for (let i = N - 1; i >= 0; i--) if (trips[i].times[key]) { idx = i; break; }
    toast("これ以降のスジはありません（最終を表示）");
  }
  selStopName = row.name;
  selKey = key;
  labelsEl.querySelectorAll(".stop-label").forEach((b) => b.classList.toggle("selected", b.dataset.name === row.name));
  track.querySelectorAll(".cell.sel").forEach((c) => c.classList.remove("sel"));
  track.querySelectorAll(`.cell[data-key="${key}"]`).forEach((c) => c.classList.add("sel"));
  if (idx >= 0) scrollToIdx(idx, smooth);
  updateCountdown();
}

// ---------- 残り時間（表示位置は動かさず、数字だけ更新する） ----------
function updateCountdown() {
  if (!tt || centerIdx < 0 || !selKey) return;
  const trip = trips[centerIdx];
  const row = tt.rows.find((r) => r.type === "stop" && selKey.startsWith(r.id + "."));
  const kind = selKey.split(".")[1];
  const v = trip.times[selKey];
  const card = $("count");
  card.className = "count";

  // 2行目：このスジの学校着と締切
  const st = status[centerIdx];
  const arr = schoolKey ? trip.times[schoolKey] : null;
  const last = tt.rows[tt.rows.length - 1];
  let sub = `No.${trip.no}`;
  if (arr) sub += ` ・ ${last.name} ${arr}着`;
  if (tt.deadline) sub += `（締切 ${tt.deadline}）`;
  if (st === "deadline") sub += `<span class="chip deadline">間に合う最終</span>`;
  if (st === "late") sub += `<span class="chip late">遅刻</span>`;
  $("cSub").innerHTML = sub;

  if (!v) {
    $("cTarget").textContent = `このスジは${row.name}を通りません`;
    $("cRemain").innerHTML = "";
    card.classList.add("past");
    return;
  }
  $("cTarget").textContent = `📍 ${row.name} ${v}${KIND_LABEL[kind]}まで`;
  const diffSec = toMin(v) * 60 - nowJstSeconds();
  const m = Math.floor(diffSec / 60);
  if (diffSec < 0) {
    const ago = Math.ceil(-diffSec / 60);
    $("cRemain").innerHTML = `<span>${kind === "dep" ? "発車済み" : "到着済み"}</span><br><small>${ago}分前</small>`;
    card.classList.add("past");
  } else if (m === 0) {
    $("cRemain").innerHTML = `<b>まもなく</b>`;
    card.classList.add("now");
  } else {
    const txt = m >= 60 ? `<b>${Math.floor(m / 60)}</b><span>時間</span><b>${m % 60}</b><span>分</span>`
                        : `<b>${m}</b><span>分</span>`;
    $("cRemain").innerHTML = `<small>あと</small>${txt}`;
    if (m <= 2) card.classList.add("now"); else if (m <= 5) card.classList.add("soon");
  }
}
setInterval(updateCountdown, 10000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) updateCountdown(); });

let toastTimer = 0;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

// ---------- 起動 ----------
buildTabs();
const saved = DATA.timetables.findIndex((t) => t.name === store.get("tt"));
switchTimetable(saved >= 0 ? saved : 0, false);
</script>
